services:
  duplicati:
    image: ghcr.io/linuxserver/duplicati
    container_name: duplicati
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
    volumes:
      - /home/alexander/backup/config:/config
      - /srv/samba/share/images:/SHARED_IMAGES:ro # from
      - /home/alexander/external-ssd:/backuped_images # to
    restart: unless-stopped
    ports:
      - 8200:8200
        